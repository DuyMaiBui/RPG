name: AuraEngine CI

on:
  push:
  pull_request:

jobs:
  native:
    name: Native reference ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run headless reference ABI test
        shell: bash
        run: ./Native/AuraEngine/build.sh

  plugin:
    name: Native Jolt + Box2D plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install cmake + ninja
        uses: lukka/get-cmake@latest
      - name: Fetch native dependencies
        shell: bash
        run: |
          ./Native/AuraEngine/fetch_jolt.sh
          ./Native/AuraEngine/fetch_box2d.sh
      - name: Build plugin (fetches dependencies itself)
        shell: bash
        run: ./Native/AuraEngine/build_plugin.sh
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaura-${{ matrix.os }}
          path: |
            Native/AuraEngine/build/plugin/libaura.*
            Native/AuraEngine/build/plugin/aura.dll
          if-no-files-found: warn

  mobile:
    name: Mobile plugin (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: ios
            arch: arm64
          - target: android
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - name: Install cmake + ninja
        uses: lukka/get-cmake@latest
      - name: Build iOS plugin
        if: matrix.target == 'ios'
        run: |
          ./Native/AuraEngine/fetch_jolt.sh
          ./Native/AuraEngine/fetch_box2d.sh
          IOS_ARCH=${{ matrix.arch }} ./Native/AuraEngine/build_ios.sh
      - name: Build Android plugin
        if: matrix.target == 'android'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./Native/AuraEngine/fetch_jolt.sh
          ./Native/AuraEngine/fetch_box2d.sh
          ANDROID_ABI=${{ matrix.abi }} ./Native/AuraEngine/build_android.sh
      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaura-${{ matrix.target }}
          path: |
            Assets/Plugins/AuraEngine/iOS/libaura.*
            Assets/Plugins/AuraEngine/Android/**/libaura.*
          if-no-files-found: warn

  bench:
    name: Performance benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install cmake + ninja
        uses: lukka/get-cmake@latest
      - name: Run benchmark harness
        shell: bash
        run: ./Native/AuraEngine/run_bench.sh

  unity:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AuraEngine EditMode tests
        run: |
          echo "Unity tests are executed on a licensed runner via the unity CLI:"
          echo "  unity test --mode EditMode --filter AuraEngine.Tests"
          echo "Provide a Unity license secret and the editor image to enable this job."
